- pipeline: "CD"
  events:
  - type: "PUSH"
    refs:
    - "refs/heads/master"
  fail_on_prepare_env_warning: true
  actions:
  - action: "Publish"
    type: "BUILD"
    docker_image_name: "library/debian"
    docker_image_tag: "bookworm-slim"
    execute_commands:
    - "export PATH=\"$PATH:/opt/flutter/bin\""
    - "if [ ! -d /opt/flutter ]; then"
    - "  git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/flutter"
    - "fi"
    - "flutter --disable-analytics"
    - "flutter --version"
    - ""
    - "mkdir -p ~/.config/dart"
    - "cat /buddy-variables/pub_dev_credentials > ~/.config/dart/pub-credentials.json"
    - ""
    - "flutter pub get"
    - "flutter analyze"
    - "flutter test"
    - "# Publish"
    - "flutter pub publish --force"
    setup_commands:
    - "apt-get update && apt-get install -y git curl ca-certificates unzip xz-utils"
    cached_dirs:
    - "/opt/flutter"
    - "/root/.pub-cache"
    shell: "BASH"
  - action: "Push Git Tag"
    type: "BUILD"
    docker_image_name: "node"
    docker_image_tag: "20"
    execute_commands:
    - "eval \"$(ssh-agent -s)\""
    - "ssh-add ~/.ssh/smartcar_ci_travis_04_15_2021"
    - "ssh-keyscan github.com >> /root/.ssh/known_hosts"
    - "git config --global user.email \"ci@smartcar.com\""
    - "git config --global user.name \"Buddy CI User\""
    - ""
    - "export SDK_VERSION=$(cat pubspec.yaml | grep -E '^version: .*$' | sed 's/^version: //')"
    - "git config remote.$BUDDY_REPO_SLUG.url || git remote add $BUDDY_REPO_SLUG $BUDDY_REPO_SSH_URL.git"
    - "git tag -af $SDK_VERSION -m \"Buddy Generated Tag\""
    - "git push $BUDDY_REPO_SLUG $SDK_VERSION"
    shell: "BASH"
